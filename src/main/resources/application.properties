# Configuração da aplicação
spring.application.name=esg-cadeia-suprimentos
server.port=8080

# Conexão com o banco de dados Oracle
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:RM566997}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sua_senha_fiap}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
