services:
  # Servico do banco de dados Oracle 23ai Free
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-esg-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: admin_password123
      APP_USER: esg_user
      APP_USER_PASSWORD: esg_senha123
    volumes:
      - oracle_dados:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Servico da API Spring Boot ESG
  api-esg:
    build: .
    container_name: api-esg-cadeia-suprimentos
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: esg_user
      SPRING_DATASOURCE_PASSWORD: esg_senha123
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: on-failure

volumes:
  oracle_dados:
